name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Match the Streamlit Community Cloud runtime range.
        python-version: ["3.11"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        # No system packages needed: the vendored PyFRB/US is patched to solve
        # with scipy's sparse solver instead of scikit-umfpack/SuiteSparse.
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run tests (incl. demo validation + MCE)
        env:
          MPLBACKEND: Agg
          OMP_NUM_THREADS: "2"
        run: |
          pytest -q -m "not slow"
          # Run the slower model-consistent-expectations test separately so a
          # timeout there is easy to spot.
          pytest -q -m "slow"
